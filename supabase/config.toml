# Local dev ports are offset +20 from the Supabase defaults because another
# local Supabase project on this machine occupies 54321-54327.
project_id = "safen"

[api]
enabled = true
port = 54341
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54342
shadow_port = 54340
major_version = 17

[studio]
enabled = true
port = 54343

[inbucket]
enabled = true
port = 54344

[analytics]
enabled = false

[functions.get-cloudinary-signature]
enabled = true
verify_jwt = false
import_map = "./functions/get-cloudinary-signature/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/get-cloudinary-signature/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/get-cloudinary-signature/*.html" ]

[functions.ingest-news]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/ingest-news/index.ts"

[functions.enrich-news]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/enrich-news/index.ts"

[functions.notify-news]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/notify-news/index.ts"
